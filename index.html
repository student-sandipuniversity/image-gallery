
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Image Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <h1>Pixel Gallery</h1>
    <p>Explore the beauty of our world</p>
  </header>

  <main class="container">
    <nav class="filters" aria-label="Image categories">
      <button class="filter active" data-category="all">All</button>
      <button class="filter" data-category="nature">Nature</button>
      <button class="filter" data-category="cities">Cities</button>
      <button class="filter" data-category="animals">Animals</button>
    </nav>

    <section class="gallery" aria-label="Photo gallery">

      <article class="gallery-item" data-category="nature">
        <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=80" alt="Mountain lake">
        <div class="caption">Mountain Lake</div>
      </article>

      <article class="gallery-item" data-category="cities">
        <img src="https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=900&q=80" alt="City skyline">
        <div class="caption">City Life</div>
      </article>

      <article class="gallery-item" data-category="animals">
        <img src="https://images.unsplash.com/photo-1472396961693-142e6e269027?auto=format&fit=crop&w=900&q=80" alt="Wild deer">
        <div class="caption">Wildlife</div>
      </article>

      <article class="gallery-item" data-category="nature">
        <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=900&q=80" alt="Green forest">
        <div class="caption">Green Forest</div>
      </article>

      <article class="gallery-item" data-category="cities">
        <img src="https://images.unsplash.com/photo-1511818966892-d7d671e672a2?auto=format&fit=crop&w=900&q=80" alt="Modern architecture">
        <div class="caption">Architecture</div>
      </article>

      <article class="gallery-item" data-category="animals">
        <img src="https://images.unsplash.com/photo-1549366021-9f761d450615?auto=format&fit=crop&w=900&q=80" alt="Wild elephant">
        <div class="caption">Wild Elephant</div>
      </article>

      <article class="gallery-item" data-category="nature">
        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80" alt="Beautiful natural landscape">
        <div class="caption">Open Landscapes</div>
      </article>

      <article class="gallery-item" data-category="cities">
        <img src="https://images.unsplash.com/photo-1514565131-fce0801e5785?auto=format&fit=crop&w=900&q=80" alt="City buildings at night">
        <div class="caption">City Lights</div>
      </article>

      <article class="gallery-item" data-category="animals">
        <img src="https://images.unsplash.com/photo-1552728089-57bdde30beb3?auto=format&fit=crop&w=900&q=80" alt="Colorful bird">
        <div class="caption">Colorful Bird</div>
      </article>

    </section>
  </main>

  <!-- Full-size image viewer -->
  <div class="lightbox" id="lightbox" role="dialog"
       aria-modal="true" aria-label="Image viewer" hidden>
    <button class="close" id="closeBtn" aria-label="Close viewer">&times;</button>
    <button class="nav prev" id="prevBtn" aria-label="Previous image">&#10094;</button>
    <figure>
      <img id="lightboxImg" src="" alt="">
      <figcaption id="lightboxCaption"></figcaption>
    </figure>
    <button class="nav next" id="nextBtn" aria-label="Next image">&#10095;</button>
  </div>

  <footer>
    <p>© 2026 Pixel Gallery | Built with HTML, CSS & JavaScript</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
